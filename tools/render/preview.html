<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Neko Bucket Hat preview</title>
<style>
  html, body { margin: 0; background: #f4eef1; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const q = new URLSearchParams(location.search);
const W = +(q.get("w") || 900), H = +(q.get("h") || 900);
const base = q.get("base") || "../../ugc/neko-bucket-hat/";
const albedo = q.get("albedo");
const showHead = q.get("head") !== "0";
const cam = (q.get("cam") || "1.5,0.55,-2.3").split(",").map(Number);
const target = (q.get("target") || "0,-0.12,0").split(",").map(Number);
const bg = q.get("bg") || "#f4eef1";
const fov = +(q.get("fov") || 30);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(bg);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(fov, W / H, 0.05, 50);
camera.position.set(...cam);
camera.lookAt(...target);

scene.add(new THREE.HemisphereLight(0xffffff, 0xe9d9df, 0.45));
const key = new THREE.DirectionalLight(0xffffff, 1.25);
key.position.set(2.0, 3.5, -2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -1.5; key.shadow.camera.right = 1.5;
key.shadow.camera.top = 1.5; key.shadow.camera.bottom = -1.5;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.01;
key.shadow.radius = 4;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffe8f0, 0.7);
rim.position.set(-2.5, 1.5, 2.5);
scene.add(rim);

const loader = new THREE.TextureLoader();
function tex(name, srgb) {
  return new Promise((res) => loader.load(base + name, (t) => {
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.anisotropy = 8;
    res(t);
  }, undefined, () => res(null)));
}

async function main() {
  const data = await (await fetch(base + "build/hat.json")).json();
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(data.position, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(data.normal, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(data.uv, 2));
  g.setIndex(data.index);

  // Roblox "Plastic": smooth, slightly glossy, non-metallic.
  const matOpts = { roughness: 0.55, metalness: 0.0 };
  matOpts.map = await tex("textures/" + albedo, true);
  const hat = new THREE.Mesh(g, new THREE.MeshStandardMaterial(matOpts));
  hat.castShadow = true;
  hat.receiveShadow = true;
  scene.add(hat);

  if (showHead) {
    // Classic Roblox-style head: rounded cylinder, 1.2 studs, top at y = 0.
    const pts = [];
    const R = 0.6, Hh = 1.2, rr = 0.26;
    pts.push(new THREE.Vector2(0, -Hh));
    for (let i = 0; i <= 10; i++) {
      const a = -Math.PI / 2 + (i / 10) * (Math.PI / 2);
      pts.push(new THREE.Vector2(R - rr + rr * Math.cos(a), -Hh + rr + rr * Math.sin(a)));
    }
    for (let i = 0; i <= 10; i++) {
      const a = (i / 10) * (Math.PI / 2);
      pts.push(new THREE.Vector2(R - rr + rr * Math.cos(a), -rr + rr * Math.sin(a)));
    }
    pts.push(new THREE.Vector2(0, 0));
    const head = new THREE.Mesh(new THREE.LatheGeometry(pts, 64),
      new THREE.MeshStandardMaterial({ color: 0xf2d27a, roughness: 0.55 }));
    head.castShadow = true; head.receiveShadow = true;
    scene.add(head);
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x2a2230, roughness: 0.4 });
    for (const s of [-1, 1]) {
      const e = new THREE.Mesh(new THREE.SphereGeometry(0.055, 24, 16), eyeMat);
      e.scale.set(0.8, 1.25, 0.35);
      e.position.set(0.2 * s, -0.62, -0.6);
      scene.add(e);
    }
    const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.018, 8, 32, Math.PI * 0.7),
      eyeMat);
    mouth.rotation.z = Math.PI + Math.PI * 0.15;
    mouth.position.set(0, -0.74, -0.6);
    scene.add(mouth);
    // neck/torso hint
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.4, 32),
      new THREE.MeshStandardMaterial({ color: 0xf2d27a, roughness: 0.6 }));
    torso.position.set(0, -1.35, 0);
    scene.add(torso);
  }

  renderer.render(scene, camera);
  window.__ready = true;
}
main();
</script>
</body>
</html>
